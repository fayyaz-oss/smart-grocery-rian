<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Shopping Cart SVG -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(10, 10)">
    <path d="M120 140 h50 l35 150 h170 l30 -110 h-220" />
    <!-- Cart Wheels -->
    <circle cx="215" cy="340" r="18" fill="#ffffff" stroke="none" />
    <circle cx="365" cy="340" r="18" fill="#ffffff" stroke="none" />
  </g>

  <!-- Safety Shield with Checkmark Badge in bottom right -->
  <g transform="translate(290, 260) scale(0.95)" filter="url(#glow)">
    <path d="M100 20 C145 20 190 40 190 90 C190 160 100 210 100 210 C100 210 10 160 10 90 C10 40 55 20 100 20 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="8"/>
    <!-- Shield Checkmark -->
    <path d="M60 105 L88 135 L145 75" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkle / Percentage Tag -->
  <circle cx="160" cy="180" r="12" fill="#facc15" />
  <circle cx="260" cy="150" r="9" fill="#facc15" />
</svg>

